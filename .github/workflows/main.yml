name: GitHub Pages
on:
  push:
    branches:
    - main
jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setup illuaminate
      run: |
        test -d bin || mkdir bin
        test -f bin/illuaminate || wget -q -Obin/illuaminate https://squiddev.cc/illuaminate/bin/latest/illuaminate-linux-x86_64
        chmod +x bin/illuaminate

    - name: Run python scripts
      run: |
        python3 build/python/hash.py
        python3 build/python/minify.py
        python3 build/python/todo.py ${GITHUB_SHA}

    - name: Generate documentation
      run: |
        bin/illuaminate doc-gen
        
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build/docs/lua
        force_orphan: true
        commit_message: Build for

  lint:
    name: Illuaminate Lint
    runs-on: ubuntu-latest

    steps:
    - name: Setup illuaminate
      run: |
        test -d bin || mkdir bin
        test -f bin/illuaminate || wget -q -Obin/illuaminate https://squiddev.cc/illuaminate/bin/latest/illuaminate-linux-x86_64
        chmod +x bin/illuaminate
        
    - name: Lint Lua code
      run: |
        bin/illuaminate lint
